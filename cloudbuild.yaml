steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'synau-backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/synau-backend:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/synau-backend:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'synau-backend'
      - '--region'
      - 'us-central1'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/synau-backend:latest'

  - name: 'node:24'
    dir: 'siswa-app'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm ci && npm run build'

  - name: 'node:24'
    dir: 'admin-guru-app'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm ci && npm run build'

  - name: 'node:24'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm install -g firebase-tools && firebase deploy --only hosting --project $PROJECT_ID'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/synau-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
